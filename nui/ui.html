<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>VAUNT MDT</title>
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
            max-height: 100vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #iframe {
            width: 100%;
            flex: 1;
            background: ghostwhite;
            overflow: scroll;
            border: none;
            margin: 0;
            padding: 0;
        }

        #tab-container {
            display: flex;
            flex: 1;
            top: 20px;
        }

        .tab {
            position: relative;
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }

        .tab-wrap {
            position: relative;
            top: 10%;
            background: black;
            width: 100%;
            max-width: 1400px;
            max-height: 70%;
            min-height: 70%;
            margin: 0 auto 0;
            padding: 30px;
            border-radius: 30px;
            transition: transform 0.75s ease, box-shadow 0.75s ease;
            display: flex;
            flex-direction: column;
        }

        .tab-wrap #dot {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid dodgerblue;
            transition: all 0.5s ease;
            align-self: center;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        .tab-wrap #dot:hover {
            background: whitesmoke;
        }

        .tab-wrap .tab {
            padding: 0;
            overflow: hidden;
        }
    </style>

</head>

<body>
    <div id="tab-container">
        <div class="tab-wrap">
            <button id="dot" type="button" aria-label="Fermer le MDT"></button>
            <div class="tab">
                <iframe id="iframe" src="https://mdt.vauntcorp.com/" title="VAUNTCORP MDT/CAD"></iframe>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const resourceName = typeof GetParentResourceName === 'function'
                ? GetParentResourceName()
                : 'vauntmdt';
            const callbackUrl = `https://${resourceName}/vaunt-mdt-bus`;

            const sendNuiMessage = (payload) => fetch(callbackUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify(payload)
            }).catch(() => {});

            const showTablet = (visible) => {
                body.style.display = visible ? 'flex' : 'none';
                if (!visible) window.blur();
            };

            const closeTablet = () => {
                showTablet(false);
                sendNuiMessage({ hide: true });
            };

            showTablet(false);
            sendNuiMessage({ load: true });

            document.getElementById('dot').addEventListener('click', closeTablet);

            window.addEventListener('message', ({ data }) => {
                if (data?.showtab) {
                    showTablet(true);
                } else if (data?.hidetab) {
                    showTablet(false);
                }
            });

            document.addEventListener('keyup', ({ key }) => {
                if (key === 'Escape') closeTablet();
            });
        });
    </script>
</body>

</html>
